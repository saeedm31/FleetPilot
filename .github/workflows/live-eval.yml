name: Live evaluation

# Runs the copilot with real Claude on the evaluation set and records demo runs for the app.
# Needs a repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model"
        default: "claude-sonnet-4-6"

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m fleetpilot build
      - name: Evaluate with real Claude
        run: python -m fleetpilot eval --live --out eval_report.json
      - name: Record demo runs
        run: python -m fleetpilot record
      - name: Commit the report and recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval_report.json demo/recordings/*.json
          git diff --cached --quiet || git commit -m "Live evaluation report and demo recordings"
          git pull --rebase
          git push
